plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = '1.0.0-Neoforge1.21.1'
group = 'com.bromax.bhbbc'

base {
    archivesName = 'bhb_bc'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        systemProperty 'neoforge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {}
    server {}
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.233"

    // BHB — needed for AnimationController, AnimationDefinition
    compileOnly files('/home/glenn/mc-modding/mod-dev/bhb-1211/build/libs/bromax_battle-1.3.7-Neoforge1.21.1.jar')

    // Better Combat — needed for CombatFlags, PlayerAttackProperties, PlayerAttackAnimatable, AnimatedHand
    compileOnly files('/home/glenn/Documents/curseforge/minecraft/Instances/S202 Neoforge/mods/bettercombat-neoforge-2.4.0+1.21.1.jar')
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'bhb_bc',
            'Specification-Vendor'    : 'bromax',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : "${version}",
            'Implementation-Vendor'   : 'bromax',
        ])
    }
}

tasks.register('deploy', Copy) {
    dependsOn build
    from(layout.buildDirectory.dir('libs')) {
        include "bhb_bc-*.jar"
        exclude "*-sources.jar"
    }
    into '/home/glenn/Documents/curseforge/minecraft/Instances/S202 Neoforge/mods'
}
