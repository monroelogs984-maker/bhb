plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = '1.5.0-Neoforge1.21.1'
group = 'com.bromax.bromaxbattle'

base {
    archivesName = 'bromax_battle'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        systemProperty 'neoforge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        // Unattended animation preview: ./gradlew runClient -PbhbPreview=all (or a name filter)
        if (project.hasProperty('bhbPreview')) {
            systemProperty 'bhb.preview', project.property('bhbPreview')
        }
        // Unattended Overpower test: -PopTest (flat survival world, runs /optest, quits)
        if (project.hasProperty('opTest')) {
            systemProperty 'bhb.optest', 'true'
        }
        // First-person guard placement candidates: -PguardFpTune (screenshots optest_guardfp_*.png)
        if (project.hasProperty('guardFpTune')) {
            systemProperty 'bhb.optest', 'true'
            systemProperty 'bhb.guardfp.tune', 'true'
        }
        // Dev damage harness: -PbhbDmgTest="60 minecraft:iron_sword" (registers /bhbdmgtest, runs it, quits)
        if (project.hasProperty('bhbDmgTest')) {
            systemProperty 'bhb.debug', 'true'
            systemProperty 'bhb.dmgtest', project.property('bhbDmgTest')
        }
        // Grip comparison sheets instead of timelines: add -PbhbGrips
        if (project.hasProperty('bhbGrips')) {
            systemProperty 'bhb.preview.grips', 'true'
        }
    }
    server {}
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.233"
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'bromax_battle',
            'Specification-Vendor'    : 'bromax',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : "${version}",
            'Implementation-Vendor'   : 'bromax',
        ])
    }
}

tasks.register('deploy', Copy) {
    dependsOn build
    from(layout.buildDirectory.dir('libs')) {
        include "bromax_battle-*.jar"
        exclude "*-sources.jar"
    }
    into '/home/glenn/Documents/curseforge/minecraft/Instances/S202Neoforge/mods'
}

tasks.register('deployTest', Copy) {
    dependsOn build
    from(layout.buildDirectory.dir('libs')) {
        include "bromax_battle-*.jar"
        exclude "*-sources.jar"
    }
    into '/home/glenn/Documents/curseforge/minecraft/Instances/1.21.1/mods'
}

// deploy pushes to both the S202 pack and the clean 1.21.1 test instance
// so neither can end up with a stale jar
deploy.finalizedBy deployTest
