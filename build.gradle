buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.4.0-1.12.2'
group = 'com.bromax.bromaxbattle'
archivesBaseName = 'bromax_battle'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    // BROMAX's Lib carries the animation engine and mixins. Build it first:
    //   cd ../bromaxlib-repo && ./gradlew build
    compile files('../bromaxlib-repo/build/libs/bromaxlib-2.0.0.jar')
}

jar {
    manifest {
        attributes([
            'Implementation-Title': 'bromax_battle',
            'Implementation-Version': "${version}"
        ])
    }
}

jar.finalizedBy('reobfJar')


processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
