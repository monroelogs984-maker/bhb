plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '0.1-1.20.1'
group = 'com.bromax.bromaxbattle'
archivesBaseName = 'bromax_battle'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                bromax_battle { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                bromax_battle { source sourceSets.main }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'bromax_battle.refmap.json'
    config 'bromax_battle.mixins.json'
}

jar {
    manifest {
        attributes([
            'Specification-Title'      : 'bromax_battle',
            'Specification-Vendor'     : 'bromax',
            'Specification-Version'    : '1',
            'Implementation-Title'     : project.name,
            'Implementation-Version'   : "${version}",
            'Implementation-Vendor'    : 'bromax',
            'MixinConfigs'             : 'bromax_battle.mixins.json'
        ])
    }
}

jar.finalizedBy('reobfJar')

task deploy {
    dependsOn build
    doLast {
        copy {
            from "build/libs/${archivesBaseName}-${version}.jar"
            into '/home/glenn/Documents/curseforge/minecraft/Instances/1.20.1 (1)/mods'
        }
        println "[DEPLOY] bromax_battle → 1.20.1 test instance"
    }
}
